[package]
name = "ringcode-web"
version = "0.1.0"
description = "Browser scanner and generator for ringcodes"
edition.workspace = true
publish = false

[dependencies]
ringcode = { path = "../ringcode" }
# Pinned to match the wasm-bindgen CLI that trunk uses.
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4.50"
js-sys = "0.3.77"
console_error_panic_hook = "0.1.7"

[dependencies.web-sys]
version = "0.3.77"
features = [
  "Blob",
  "BlobPropertyBag",
  "CanvasRenderingContext2d",
  "ClipboardEvent",
  "DataTransfer",
  "Document",
  "DomTokenList",
  "DragEvent",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "HtmlButtonElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlImageElement",
  "HtmlInputElement",
  "HtmlVideoElement",
  "KeyboardEvent",
  "ImageData",
  "MediaDevices",
  "MediaStream",
  "MediaStreamConstraints",
  "MediaStreamTrack",
  "Navigator",
  "Performance",
  "TextMetrics",
  "Url",
  "Window",
  "console",
]
