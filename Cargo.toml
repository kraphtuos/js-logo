[workspace]
members = ["ringcode"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Detection is numeric-heavy; keep test builds reasonably fast.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
